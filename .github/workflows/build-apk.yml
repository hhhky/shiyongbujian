name: Build APK

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Bump patch version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          MAJOR=$(echo $VERSION | cut -d. -f1)
          MINOR=$(echo $VERSION | cut -d. -f2)
          PATCH=$(echo $VERSION | cut -d. -f3)
          NEW="$MAJOR.$MINOR.$((PATCH + 1))"
          echo "Bumping $VERSION → $NEW"
          node -e "
            var fs = require('fs');
            var pkg = require('./package.json');
            pkg.version = '$NEW';
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
            var js = fs.readFileSync('js/app.js', 'utf8');
            js = js.replace(/const APP_VERSION = '[^']*'/, \"const APP_VERSION = '$NEW'\");
            fs.writeFileSync('js/app.js', js);
          "
          echo "version=$NEW" >> $GITHUB_OUTPUT

      - name: Copy web assets to www
        run: |
          mkdir -p www/js
          cp index.html manifest.json sw.js icon-192.png icon-512.png www/
          cp js/*.js www/js/

      - name: Install Capacitor deps
        run: npm install

      - name: Sync Web Assets to Android
        run: |
          mkdir -p android/app/src/main/assets/public
          mkdir -p android/app/src/main/res/xml
          cp -r www/* android/app/src/main/assets/public/
          cp capacitor.config.json android/app/src/main/assets/capacitor.config.json
          echo '[]' > android/app/src/main/assets/capacitor.plugins.json

      - name: Build APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: shiyongbujian-debug-v${{ steps.version.outputs.version }}
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json js/app.js
          git commit -m "chore: bump version to v${{ steps.version.outputs.version }}" || true
          git push || true
