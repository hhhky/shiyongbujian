name: Build APK

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Bump version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          MAJOR=$(echo $VERSION | cut -d. -f1)
          MINOR=$(echo $VERSION | cut -d. -f2)
          PATCH=$(echo $VERSION | cut -d. -f3)
          NEW="$MAJOR.$MINOR.$((PATCH + 1))"
          VCODE=$((MAJOR * 10000 + MINOR * 100 + PATCH + 1))
          echo "Bumping $VERSION → $NEW  versionCode=$VCODE"
          node -e "
            var fs = require('fs');
            var pkg = require('./package.json');
            pkg.version = '$NEW';
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
            var js = fs.readFileSync('js/app.js', 'utf8');
            js = js.replace(/const APP_VERSION = '[^']*'/, \"const APP_VERSION = '$NEW'\");
            fs.writeFileSync('js/app.js', js);
          "
          sed -i "s/versionCode [0-9]*/versionCode $VCODE/" android/app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"$NEW\"/" android/app/build.gradle
          echo "version=$NEW" >> $GITHUB_OUTPUT

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
            echo "KEYSTORE_READY=true" >> $GITHUB_ENV
          else
            echo "未配置签名密钥，将使用 Debug 签名"
            echo "KEYSTORE_READY=false" >> $GITHUB_ENV
          fi

      - name: Copy web assets to www
        run: |
          mkdir -p www/js
          cp index.html manifest.json sw.js icon-192.png icon-512.png www/
          cp js/*.js www/js/

      - name: Install Capacitor deps
        run: npm install

      - name: Sync Web Assets to Android
        run: |
          mkdir -p android/app/src/main/assets/public
          mkdir -p android/app/src/main/res/xml
          cp -r www/* android/app/src/main/assets/public/
          cp capacitor.config.json android/app/src/main/assets/capacitor.config.json
          echo '[]' > android/app/src/main/assets/capacitor.plugins.json

      - name: Build APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android && chmod +x gradlew
          if [ "$KEYSTORE_READY" = "true" ]; then
            ./gradlew assembleRelease --no-daemon
          else
            ./gradlew assembleDebug --no-daemon
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: shiyongbujian-v${{ steps.version.outputs.version }}
          path: android/app/build/outputs/apk/*/app-*.apk

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json js/app.js android/app/build.gradle
          git commit -m "chore: bump version to v${{ steps.version.outputs.version }}" || true
          git push || true
